<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Knosyn 智研教育">
  <defs>
    <linearGradient id="bTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#223d74"/>
      <stop offset=".55" stop-color="#12244a"/>
      <stop offset="1" stop-color="#0a1428"/>
    </linearGradient>
    <linearGradient id="bSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".17"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ef2cb"/>
      <stop offset="1" stop-color="#0eb489"/>
    </linearGradient>
    <linearGradient id="bTeal2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0eb489"/>
      <stop offset="1" stop-color="#6ef2cb"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="17" fill="url(#bTile)"/>
  <rect width="64" height="64" rx="17" fill="url(#bSheen)"/>
  <rect x=".6" y=".6" width="62.8" height="62.8" rx="16.4" fill="none" stroke="#fff" stroke-opacity=".13"/>

  <!-- lattice links -->
  <g fill="none" stroke-linecap="round">
    <path d="M27.6 32 C31.5 27.6 35.6 23.9 39.9 20.6" stroke="url(#bTeal)" stroke-width="2.1"/>
    <path d="M27.6 32 C31.5 36.4 35.6 40.1 39.9 43.4" stroke="url(#bTeal2)" stroke-width="2.1"/>
    <path d="M27.6 32 H17.8" stroke="#fff" stroke-opacity=".55" stroke-width="1.9"/>
    <path d="M40.4 20.9 C45.2 26.3 45.2 37.7 40.4 43.1" stroke="#fff" stroke-opacity=".26" stroke-width="1.2" stroke-dasharray="1.7 3.3"/>
  </g>

  <!-- nodes -->
  <circle cx="41.2" cy="19.4" r="5.1" fill="url(#bTeal)"/>
  <circle cx="41.2" cy="44.6" r="5.1" fill="url(#bTeal2)"/>
  <circle cx="27.3" cy="32" r="6.2" fill="#fff"/>
  <circle cx="15.6" cy="32" r="2.7" fill="url(#bTeal)"/>
  <circle cx="33.4" cy="14.4" r="1.8" fill="#fff" opacity=".5"/>
  <circle cx="33.4" cy="49.6" r="1.8" fill="#fff" opacity=".5"/>
</svg>
